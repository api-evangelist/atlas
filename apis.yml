name: Atlas
description: >-
  Atlas is an AI implementation partner built for independent accounting firms, deploying supervised,
  firm-specific AI "junior accountants" that automate repetitive, data-intensive workflows such as client
  onboarding, follow-ups, bookkeeping, compliance, and financial reporting while keeping human accountants
  in control of every decision and client relationship. Founded by Arpit Maheshwari (CEO) and Jagmal Singh
  (CTO) and co-led by Accel and Stellaris with Felicis participation, Atlas raised a $6M seed round in 2026
  to scale its network of partner firms across North America. Atlas is currently a services-led AI company
  and publishes no public API, SDKs, or developer portal.
